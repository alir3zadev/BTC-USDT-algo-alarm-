name: Elite Algo 4h Signal Alert

on:
  schedule:
    # Runs every 15 minutes. Cheap and safe margin for a 4h candle close;
    # GitHub's scheduler is not perfectly precise, so a tighter interval
    # than 4h is needed to catch the close reliably.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the state file back

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal check
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SYMBOL: "BTC/USDT"
        run: python elite_algo_alert.py

      - name: Commit updated state file
        run: |
          git config user.name "elite-algo-bot"
          git config user.email "actions@github.com"
          git add last_signal_state.txt
          git diff --quiet --cached || git commit -m "update last signal state [skip ci]"
          git push
