name: Elite Algo 15m Signal Alert

on:
  schedule:
    # Kept only as a rare backup in case cron-job.org is ever down.
    # cron-job.org is now the primary, reliable trigger (every ~15 min
    # via workflow_dispatch). Running this internal schedule too often
    # caused overlapping runs and git push conflicts.
    - cron: "0 */6 * * *"   # backup run every 6 hours
  workflow_dispatch: {}     # triggered by cron-job.org (and available manually)

permissions:
  contents: write   # needed so the workflow can commit the state file back

concurrency:
  group: elite-algo-signal-check
  cancel-in-progress: false   # queue overlapping runs instead of racing them

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal check
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SYMBOL: "BTC/USDT"
          TIMEFRAME: "15m"   # change this to switch timeframe, e.g. "1h", "4h", "1d"
        run: python elite_algo_alert.py

      - name: Commit updated state file
        run: |
          git config user.name "elite-algo-bot"
          git config user.email "actions@github.com"
          git add last_signal_state_*.txt
          if git diff --quiet --cached; then
            echo "No state change, nothing to commit."
            exit 0
          fi
          git commit -m "update last signal state [skip ci]"
          # Retry push a few times in case another run pushed in between
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected, pulling latest and retrying ($i/5)..."
            git pull --rebase origin main
            sleep 3
          done
          echo "Push failed after retries."
          exit 1
